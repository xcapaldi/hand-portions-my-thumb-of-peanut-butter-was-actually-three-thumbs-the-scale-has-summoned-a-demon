<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f4f">
  <title>Hand Portions</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hand Portions</h1>
    <button id="settings-toggle" type="button" aria-expanded="false">Settings</button>
  </header>

  <main>
    <form id="settings" hidden>
      <h2>Settings</h2>
      <label>Units
        <select name="units">
          <option value="kg">kg</option>
          <option value="lb">lb</option>
        </select>
      </label>
      <label>Thumbs of fat / day <input name="fat" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <label>Cupped palms of carbs / day <input name="carbs" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <label>Fists of veggies / day <input name="veggies" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <label>Palms of protein / day <input name="protein" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <button type="submit">Save settings</button>
    </form>

    <form id="entry">
      <h2>Add</h2>
      <label>Date <input name="date" type="date" required></label>
      <label><span>Weight (<span class="unit">kg</span>)</span> <input name="weight" type="number" min="0" step="0.1" inputmode="decimal"></label>
      <label>Thumbs of fat <input name="fat" type="number" step="0.5" inputmode="decimal"></label>
      <label>Cupped palms of carbs <input name="carbs" type="number" step="0.5" inputmode="decimal"></label>
      <label>Fists of veggies <input name="veggies" type="number" step="0.5" inputmode="decimal"></label>
      <label>Palms of protein <input name="protein" type="number" step="0.5" inputmode="decimal"></label>
      <p class="hint">Portions add to that day's total (use a negative number to correct). Weight replaces that day's weight.</p>
      <button type="submit">Add</button>
    </form>

    <section>
      <h2>Days</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Weight</th>
              <th>Fat</th>
              <th>Carbs</th>
              <th>Veg</th>
              <th>Protein</th>
            </tr>
          </thead>
          <tbody id="days"></tbody>
        </table>
      </div>
      <p id="empty" class="hint">Nothing logged yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
